<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Content Classifier AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  
      <style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
}

h1 {
    font-size: 38px;
    margin-top: 40px;
    letter-spacing: 1px;
}

.subtitle {
    opacity: 0.8;
    margin-bottom: 30px;
}

.card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 40px;
    width: 500px;
    margin: auto;
    box-shadow: 0 0 40px rgba(0, 255, 255, 0.2);
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.02);
}

button {
    background: linear-gradient(90deg, #00f5ff, #00ff95);
    border: none;
    padding: 12px 25px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    color: black;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00ffcc;
}

input {
    margin-top: 15px;
}

#image-preview img {
    margin-top: 20px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,255,255,0.4);
}

.prediction-bar {
    margin: 10px 0;
    text-align: left;
}

.bar-container {
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 10px;
    border-radius: 20px;
    background: linear-gradient(90deg, #00f5ff, #00ff95);
    transition: width 0.5s ease-in-out;
}

footer {
    margin-top: 40px;
    opacity: 0.7;
}
</style>
  
</head>

<body>

  <h1>🧠 LinkedIn Content Classifier AI</h1>
  <p>Classifies posts into High Value, Promotional, or Casual</p>

  <div class="container">
    <button type="button" onclick="init()">Load AI Model</button>
    <br><br>
    <input type="file" accept="image/*" onchange="predictImage(event)">
    <div id="image-preview"></div>
    <div id="label-container"></div>
  </div>

  <footer>
    Built by Pinky Devi | Community Manager, Data Analyst & AI Explorer 🚀
  </footer>

<script>
    const MODEL_URL = "./";

    let model, maxPredictions;

    async function init() {
        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
        alert("Model Loaded Successfully!");
    }

    async function predictImage(event) {
        const file = event.target.files[0];
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.width = 300;

        const preview = document.getElementById("image-preview");
        preview.innerHTML = "";
        preview.appendChild(img);

        const prediction = await model.predict(img);
        const labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";

        for (let i = 0; i < maxPredictions; i++) {

    const percentage = (prediction[i].probability * 100).toFixed(2);

    const wrapper = document.createElement("div");
    wrapper.className = "prediction-bar";

    wrapper.innerHTML = `
        <div>${prediction[i].className} - ${percentage}%</div>
        <div class="bar-container">
            <div class="bar" style="width:${percentage}%"></div>
        </div>
    `;

    labelContainer.appendChild(wrapper);
}
    }
</script>

</body>
</html>
